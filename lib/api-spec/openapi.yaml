openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Customer-facing catalog operations
  - name: orders
    description: Customer order operations
  - name: partner
    description: Store partner operations
  - name: admin
    description: Platform administration and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List catalog categories
      responses:
        "200":
          description: Available categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /catalog/items:
    get:
      operationId: listCatalogItems
      tags: [catalog]
      summary: Browse catalog inventory
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
  /catalog/items/{id}:
    patch:
      operationId: updateCatalogItem
      tags: [partner]
      summary: Update item price or stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for the current role
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [customer, partner, admin]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a customer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details and live status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
    patch:
      operationId: updateOrderStatus
      tags: [partner]
      summary: Update fulfillment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /partner/summary:
    get:
      operationId: getPartnerSummary
      tags: [partner]
      summary: Get partner operations summary
      responses:
        "200":
          description: Partner dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSummary"
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get sales and revenue analytics
      responses:
        "200":
          description: Admin analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
  /admin/zones:
    get:
      operationId: listDeliveryZones
      tags: [admin]
      summary: List delivery zones
      responses:
        "200":
          description: Delivery zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryZone"
    post:
      operationId: createDeliveryZone
      tags: [admin]
      summary: Add delivery zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneInput"
      responses:
        "201":
          description: Created zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
  /admin/zones/{id}:
    patch:
      operationId: updateDeliveryZone
      tags: [admin]
      summary: Update delivery zone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneInput"
      responses:
        "200":
          description: Updated zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, itemCount]
      properties:
        id: { type: string }
        name: { type: string }
        itemCount: { type: integer }
    CatalogItem:
      type: object
      required: [id, name, category, unit, price, compareAtPrice, stock, emoji, badge]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        price: { type: number }
        compareAtPrice: { type: number }
        stock: { type: integer }
        emoji: { type: string }
        badge: { type: string }
    CatalogItemUpdate:
      type: object
      properties:
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        badge: { type: string }
    OrderItem:
      type: object
      required: [id, name, quantity, price, unit, emoji]
      properties:
        id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        price: { type: number }
        unit: { type: string }
        emoji: { type: string }
    Order:
      type: object
      required: [id, customerName, status, statusLabel, items, subtotal, deliveryFee, total, address, eta, createdAt, updatedAt]
      properties:
        id: { type: integer }
        customerName: { type: string }
        status:
          type: string
          enum: [placed, packing, out_for_delivery, delivered]
        statusLabel: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        address: { type: string }
        eta: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    OrderInput:
      type: object
      required: [items, address]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItem" }
        address: { type: string, minLength: 1 }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [placed, packing, out_for_delivery, delivered]
    PartnerSummary:
      type: object
      required: [ordersToday, pendingOrders, lowStockItems, todayRevenue]
      properties:
        ordersToday: { type: integer }
        pendingOrders: { type: integer }
        lowStockItems: { type: integer }
        todayRevenue: { type: number }
    AdminAnalytics:
      type: object
      required: [totalSales, platformRevenue, activeCustomers, ordersToday, dailySales]
      properties:
        totalSales: { type: number }
        platformRevenue: { type: number }
        activeCustomers: { type: integer }
        ordersToday: { type: integer }
        dailySales:
          type: array
          items:
            $ref: "#/components/schemas/DailySale"
    DailySale:
      type: object
      required: [day, sales, orders]
      properties:
        day: { type: string }
        sales: { type: number }
        orders: { type: integer }
    DeliveryZone:
      type: object
      required: [id, name, eta, fee, active, orderCount]
      properties:
        id: { type: integer }
        name: { type: string }
        eta: { type: string }
        fee: { type: number }
        active: { type: boolean }
        orderCount: { type: integer }
    DeliveryZoneInput:
      type: object
      required: [name, eta, fee]
      properties:
        name: { type: string, minLength: 1 }
        eta: { type: string, minLength: 1 }
        fee: { type: number, minimum: 0 }

